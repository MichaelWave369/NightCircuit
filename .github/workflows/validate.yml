name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  nc001-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate NC-001 contract
        run: python scripts/validate_structure.py
