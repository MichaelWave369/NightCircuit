name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate repository structure
        run: python scripts/validate_structure.py
      - name: Validate NC-002 movement contract
        run: python scripts/validate_nc002.py
      - name: Validate NC-003 world flow
        run: python scripts/validate_nc003.py
      - name: Validate NC-004 combat contract
        run: python scripts/validate_nc004.py
      - name: Validate NC-005 Φ-Bot contract
        run: python scripts/validate_nc005.py
      - name: Validate NC-006 action lifecycle
        run: python scripts/validate_nc006.py
      - name: Validate NC-007 player protocol
        run: python scripts/validate_nc007.py
      - name: Validate NC-008 local agent seat
        run: python scripts/validate_nc008.py
      - name: Compile external P3 clients
        run: python -m py_compile tools/p3_client.py tools/p3_ollama_agent.py
      - name: Validate NC-009 Ash Village
        run: python scripts/validate_nc009.py
      - name: Validate NC-010 day/night state
        run: python scripts/validate_nc010.py
      - name: Validate NC-011 Reality Ledger
        run: python scripts/validate_nc011.py
      - name: Validate NC-012 The Fallen
        run: python scripts/validate_nc012.py
