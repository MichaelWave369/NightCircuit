name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate repository structure
        run: python scripts/validate_structure.py
      - name: Validate NC-002 movement contract
        run: python scripts/validate_nc002.py
      - name: Validate NC-003 world flow
        run: python scripts/validate_nc003.py
      - name: Validate NC-004 combat contract
        run: python scripts/validate_nc004.py
      - name: Validate NC-005 Φ-Bot contract
        run: python scripts/validate_nc005.py
      - name: Validate NC-006 action lifecycle
        run: python scripts/validate_nc006.py
      - name: Validate NC-007 player protocol
        run: python scripts/validate_nc007.py
      - name: Validate NC-008 local agent seat
        run: python scripts/validate_nc008.py
      - name: Compile external P3 clients
        run: python -m py_compile tools/p3_client.py tools/p3_ollama_agent.py
      - name: Validate NC-009 Ash Village
        run: python scripts/validate_nc009.py
      - name: Validate NC-010 day/night state
        run: python scripts/validate_nc010.py
      - name: Validate NC-011 Reality Ledger
        run: python scripts/validate_nc011.py
      - name: Validate NC-012 The Fallen
        run: python scripts/validate_nc012.py
      - name: Validate NC-013 Scout Core
        run: python scripts/validate_nc013.py
      - name: Validate NC-014 backtracking loop
        run: python scripts/validate_nc014.py
      - name: Validate NC-015 vertical slice qualification
        run: python scripts/validate_nc015.py
      - name: Validate NC-016 playtest harness
        run: python scripts/validate_nc016.py
      - name: Compile playtest summarizer
        run: python -m py_compile tools/summarize_playtest.py
      - name: Validate NC-017 local first-boot fix
        run: python scripts/validate_nc017.py

  godot-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot 4.3
        run: |
          curl -L --fail --retry 3             -o /tmp/godot.zip             https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
      - name: Godot 4.3 headless parse
        run: /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Godot 4.3 boot smoke
        run: timeout 20s /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --quit-after 10
      - name: Godot runtime integration smoke
        run: /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tests/qualification/runtime_integration_smoke.gd
